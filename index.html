<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Pinned — Map Memories</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f11;
  --surface: #18181c;
  --surface2: #222228;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --text: #f0ede8;
  --text-2: #9d9a96;
  --text-3: #5a5855;
  --accent: #e8c97a;
  --accent-dim: rgba(232,201,122,0.12);
  --accent-hover: #f0d98a;
  --red: #e07070;
  --green: #6dbf9a;
  --radius: 14px;
  --radius-sm: 8px;
  --topbar-h: 58px;
  --sidebar-w: 300px;
  --transition: 0.18s cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 900;
  flex-shrink: 0;
}
.logo {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 22px;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo-pin {
  width: 22px;
  height: 22px;
  background: var(--accent);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: inline-block;
  position: relative;
}
.logo-pin::after { content: ''; width: 8px; height: 8px; background: var(--bg); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
.tabs-scroll { flex: 1; overflow-x: auto; scrollbar-width: none; display: flex; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs-wrap { display: flex; gap: 4px; padding: 0 2px; }
.tab {
  font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px;
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  cursor: pointer; transition: all var(--transition);
}
.tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
.tab.active { background: var(--accent-dim); border-color: rgba(232,201,122,0.3); color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn {
  font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2);
  cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all var(--transition);
}
.btn:hover { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.18); }
.btn.primary { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: rgba(224,112,112,0.15); border-color: rgba(224,112,112,0.3); color: var(--red); }
.mine-toggle { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.mine-toggle input { display: none; }
.toggle-track { width: 32px; height: 18px; background: var(--surface2); border: 1px solid var(--border-strong); border-radius: 999px; position: relative; transition: all var(--transition); }
.toggle-track::after { content: ''; position: absolute; width: 12px; height: 12px; background: var(--text-3); border-radius: 50%; top: 2px; left: 2px; transition: all var(--transition); }
.mine-toggle input:checked + .toggle-track { background: var(--accent-dim); border-color: rgba(232,201,122,0.4); }
.mine-toggle input:checked + .toggle-track::after { background: var(--accent); transform: translateX(14px); }
.user-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding: 5px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; }
.user-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.body { display: flex; flex: 1; overflow: hidden; }
#map { flex: 1; height: 100%; z-index: 1; background: #1a1a1f; }
.leaflet-tile { filter: brightness(0.85) saturate(0.8) hue-rotate(5deg); }
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--surface);
  border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
  transition: transform var(--transition);
}
.sidebar-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.sidebar-title { font-family: 'Instrument Serif', serif; font-size: 17px; }
.sidebar-sub { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.mem-list { overflow-y: auto; flex: 1; scrollbar-width: thin; }
.mem-card { padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--transition); position: relative; }
.mem-card.active { background: rgba(232,201,122,0.06); }
.mem-card.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.mem-img { width: 100%; height: 120px; border-radius: 10px; object-fit: cover; margin-bottom: 10px; }
.mem-emoji-bg { width: 100%; height: 72px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: var(--surface2); margin-bottom: 10px; }
.mem-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.mem-place { font-size: 13.5px; font-weight: 600; }
.mem-badge { font-size: 9.5px; font-weight: 600; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; }
.mem-caption, .mem-date, .tag-list { font-size: 12px; color: var(--text-2); margin-top: 5px; }
.mini-btn { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; }
.comments { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.comment { font-size: 11.5px; margin-bottom: 7px; display: flex; justify-content: space-between; }
.comment-input { width: 100%; padding: 7px 10px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.overlay.hidden { display: none; }
.modal, .upload-modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 32px; width: 460px; max-width: 94vw; max-height: 90vh; overflow-y: auto; animation: fadeIn 0.2s; position: relative; }
.upload-modal h2 { font-family: 'Instrument Serif', serif; font-size: 24px; margin-bottom: 20px; }
.upload-modal label { font-size: 11.5px; font-weight: 500; color: var(--text-3); text-transform: uppercase; display: block; margin-bottom: 5px; }
.upload-modal input, .upload-modal select, .upload-modal textarea {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); font-size: 13.5px; color: var(--text); margin-bottom: 16px;
}
.location-search-group { display: flex; gap: 8px; margin-bottom: 16px; }
.location-search-group input { flex: 1; margin-bottom: 0; }
.location-search-group .btn { padding: 10px; margin: 0; }
.location-preview { background: var(--surface2); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; color: var(--accent); }
.file-drop { border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 24px; text-align: center; cursor: pointer; margin-bottom: 16px; }
.file-drop.has-file { border-color: var(--green); background: rgba(109,191,154,0.05); }
.upload-actions { display: flex; gap: 8px; margin-top: 8px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.lightbox.hidden { display: none; }
.sidebar-toggle-mobile { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 800; background: var(--accent); border-radius: 50%; width: 50px; height: 50px; align-items: center; justify-content: center; cursor: pointer; }
@media (max-width: 768px) {
  .sidebar { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 55vh; border-top: 1px solid var(--border-strong); transform: translateY(100%); z-index: 700; border-radius: 20px 20px 0 0; }
  .sidebar.open { transform: translateY(0); }
  .sidebar-toggle-mobile { display: flex; }
  .tabs-scroll { display: none; }
  .mine-toggle { display: none; }
}
.leaflet-control-geocoder { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; }
.leaflet-control-geocoder-form input { background: var(--bg); color: var(--text); }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
</head>
<body>

<div class="overlay hidden" id="auth-overlay"><div class="modal"><button class="modal-close" onclick="closeAuth()">×</button><h2 id="auth-title">Welcome back</h2><p id="auth-sub">Sign in to pin your memories to the map.</p><div class="modal-err" id="auth-err"></div><input type="email" id="auth-email" placeholder="your@email.com"/><input type="password" id="auth-pass" placeholder="Password"/><button class="btn primary" onclick="submitAuth()">Continue →</button><div class="modal-msg" id="auth-msg"></div><div class="switch" id="auth-switch" onclick="toggleAuthMode()">No account? <span>Sign up</span></div></div></div>

<div class="overlay hidden" id="upload-overlay"><div class="upload-modal"><button class="modal-close" onclick="closeUpload()">×</button><h2>Pin a memory</h2>
  <label>Campus / general area (optional fallback)</label>
  <select id="up-campus"></select>
  <label>📍 Exact location (search below)</label>
  <div class="location-search-group">
    <input type="text" id="location-search-input" placeholder="Search for a place, address, or lat,lng" />
    <button class="btn" id="search-location-btn" onclick="searchLocation()">🔍</button>
  </div>
  <div id="location-preview" class="location-preview hidden">
    <span>📍</span> <span id="selected-location-label">No location selected</span>
  </div>
  <label>Place name (display title)</label>
  <input type="text" id="up-place" placeholder="e.g., The Lawn, Ben & Jerry's, Hidden bench" />
  <label>Caption</label>
  <textarea id="up-caption" placeholder="What's the vibe?"></textarea>
  <label>Tag friends (emails)</label>
  <input type="text" id="up-tags" placeholder="friend@example.com"/>
  <label>Photo (optional)</label>
  <div class="file-drop" id="file-drop" onclick="document.getElementById('up-file').click()"><span class="file-drop-icon">🖼️</span> Tap to choose a photo</div>
  <input type="file" id="up-file" accept="image/*" style="display:none" onchange="handleFile(this)"/>
  <div class="modal-err" id="up-err"></div>
  <div class="upload-actions"><button class="btn" onclick="closeUpload()">Cancel</button><button class="btn primary" onclick="submitMemory()">Post memory</button></div>
</div></div>

<div class="topbar"><div class="logo"><div class="logo-pin"></div>Pinned</div><div class="tabs-scroll"><div class="tabs-wrap" id="tabs"></div></div><div class="topbar-right"><div class="user-chip" id="user-chip" style="display:none"><div class="user-dot"></div><span id="user-email-label"></span></div><button class="btn" id="auth-btn" onclick="openAuth()">Sign in</button><button class="btn primary" id="add-btn" style="display:none" onclick="openUpload()">+ Memory</button><label class="mine-toggle"><input type="checkbox" id="mine-only-toggle" onchange="toggleMineOnly()"/><div class="toggle-track"></div>Mine</label><button class="btn" id="signout-btn" style="display:none" onclick="signOut()">Sign out</button></div></div>

<div class="body"><div id="map"></div><div class="sidebar" id="sidebar"><div class="sidebar-handle"></div><div class="sidebar-header"><div class="sidebar-title" id="s-title">All memories</div><div class="sidebar-sub" id="s-sub">Loading…</div></div><div class="mem-list" id="mem-list"></div></div></div>
<button class="sidebar-toggle-mobile" id="sidebar-toggle-btn" onclick="toggleMobileSidebar()">☰</button>
<div class="lightbox hidden" id="lightbox" onclick="closeLightbox(event)"><div class="lightbox-close" onclick="document.getElementById('lightbox').classList.add('hidden')">×</div><img id="lightbox-img" src="" alt="memory"/></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dsxwytqvoshceqwljibr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeHd5dHF2b3NoY2Vxd2xqaWJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTk3MTEsImV4cCI6MjA5NTE3NTcxMX0.ik0qV5ygBS4HT-IW06V9rMrxaC6GGb_kS9uos5XBfT0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CAMPUSES = [
  {name:'Haverford', lat:39.9879, lng:-75.3054, color:'#a89cff'},{name:'William & Mary', lat:37.2707, lng:-76.7075, color:'#6dbf9a'},
  {name:'Duke', lat:36.0014, lng:-78.9382, color:'#6ab0e8'},{name:'Maryland', lat:38.9869, lng:-76.9426, color:'#e07070'},
  {name:'American', lat:38.9376, lng:-77.0872, color:'#e8c97a'},{name:'Vermont', lat:44.4759, lng:-73.1965, color:'#7fc97a'},
  {name:'Mt Holyoke', lat:42.2548, lng:-72.5739, color:'#e87ab0'},{name:'Florida Tech', lat:28.0617, lng:-80.6243, color:'#e8956a'},
  {name:'Cal Poly SLO', lat:35.2999, lng:-120.6625, color:'#6dbf9a'},{name:'Richmond', lat:37.5745, lng:-77.5408, color:'#b09aee'},
  {name:'Ohio State', lat:40.0076, lng:-83.0300, color:'#c9b89a'}
];
let map, markers = {}, memories = [], activeView = 'all', activeId = null, currentUser = null, authMode = 'signin';
let selectedFile = null, showMineOnly = false, commentsByMemory = {}, mobileSidebarOpen = false;
let pendingCustomLocation = null; // { lat, lng, displayName }

function campusFor(name){ return CAMPUSES.find(c => c.name === name); }

function initMap(){
  map = L.map('map', {zoomControl: true}).setView([39.5, -90], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  setTimeout(() => map.invalidateSize(), 100);
  
  // Optional: add geocoder control to map for convenience, but we also have custom search
  L.Control.geocoder({ defaultMarkGeocode: false }).addTo(map).on('markgeocode', function(e) {
    const center = e.geocode.center;
    const name = e.geocode.name;
    setSelectedLocation(center.lat, center.lng, name);
    map.flyTo(center, 14);
  });
}

async function loadMemories(){
  const { data, error } = await sb.from('memories').select('*').order('created_at', {ascending: false});
  if(error) return;
  memories = data || [];
  clearMarkers();
  memories.forEach(addMarker);
  renderSidebar();
}

function clearMarkers(){ Object.values(markers).forEach(m => m.remove()); markers = {}; }

function addMarker(m){
  // if memory has custom coordinates, use them; otherwise fallback to campus jitter
  let lat = m.custom_lat, lng = m.custom_lng;
  if(lat && lng) {
    // exact custom location
  } else {
    const c = campusFor(m.campus);
    if(!c) return;
    lat = c.lat + (Math.random() - 0.5) * 0.008;
    lng = c.lng + (Math.random() - 0.5) * 0.008;
  }
  const c = campusFor(m.campus) || {color:'#9d9a96'};
  const marker = L.circleMarker([lat, lng], {
    radius: 9, fillColor: c.color, color: 'rgba(15,15,17,0.8)', weight: 2.5, fillOpacity: 0.9
  }).addTo(map);
  marker.on('click', () => selectMemory(m.id));
  marker.bindTooltip(m.place + ' · ' + m.campus, {direction: 'top', offset: [0, -10]});
  markers[m.id] = marker;
}

function setView(campus){
  activeView = campus; activeId = null;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', (campus === 'all' && t.textContent === 'All') || t.textContent === campus));
  const filtered = getFilteredMemories();
  document.getElementById('s-title').textContent = campus === 'all' ? 'All memories' : campus;
  document.getElementById('s-sub').textContent = filtered.length + ' memory' + (filtered.length === 1 ? '' : 'ies');
  Object.entries(markers).forEach(([id, mk]) => {
    const mem = memories.find(m => m.id === id);
    const show = campus === 'all' || (mem && mem.campus === campus);
    mk.setStyle({opacity: show ? 1 : 0.1, fillOpacity: show ? 0.9 : 0.05});
  });
  if(campus !== 'all'){
    const c = campusFor(campus);
    if(c) map.flyTo([c.lat, c.lng], 12, {duration: 0.8});
  } else map.flyTo([39.5, -90], 4, {duration: 0.8});
  renderList(filtered);
}

function renderSidebar(){ renderList(getFilteredMemories()); }

function renderList(list){
  const el = document.getElementById('mem-list');
  if(!list.length){ el.innerHTML = `<div class="empty"><span class="empty-icon">🗺️</span>No memories here yet.</div>`; return; }
  el.innerHTML = list.map(m => {
    const c = campusFor(m.campus) || {bg:'rgba(255,255,255,0.05)', tc:'#9d9a96'};
    const imgHtml = m.photo_url ? `<img class="mem-img" src="${m.photo_url}" onclick="event.stopPropagation();openLightbox('${m.photo_url}')"/>` : `<div class="mem-emoji-bg">📍</div>`;
    const date = new Date(m.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    const isOwner = currentUser && currentUser.id === m.user_id;
    return `<div class="mem-card${activeId === m.id ? ' active' : ''}" id="card${m.id}" onclick="selectMemory('${m.id}')">
      ${imgHtml}
      <div class="mem-row"><span class="mem-place">${escapeHtml(m.place)}</span><span class="mem-badge" style="background:${c.bg};color:${c.tc}">${m.campus}</span></div>
      <div class="mem-who">${m.user_email || 'Anonymous'}</div>
      <div class="mem-caption">${escapeHtml(m.caption)}</div>
      ${m.tagged_emails && m.tagged_emails.length ? `<div class="tag-list">🏷 ${m.tagged_emails.join(', ')}</div>` : ''}
      <div class="mem-date">${date}</div>
      <div class="mem-actions">${isOwner ? `<button class="mini-btn del" onclick="event.stopPropagation();deleteMemory('${m.id}')">Delete</button>` : ''}</div>
      <div class="comments">
        ${(commentsByMemory[m.id] || []).map(co => `<div class="comment"><span><strong>${escapeHtml(co.user_email)}</strong>: ${escapeHtml(co.text)}</span>${currentUser && co.user_email === currentUser.email ? `<button class="mini-btn del" onclick="event.stopPropagation();deleteComment('${m.id}','${co.id}')">×</button>` : ''}</div>`).join('')}
        ${currentUser ? `<input class="comment-input" id="comment-input-${m.id}" placeholder="Leave a comment…" onclick="event.stopPropagation()"/><button class="mini-btn" style="margin-top:6px" onclick="event.stopPropagation();addComment('${m.id}')">Post</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

function selectMemory(id){
  activeId = id;
  document.querySelectorAll('.mem-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card' + id);
  if(card) card.classList.add('active');
  Object.entries(markers).forEach(([mid, mk]) => mk.setStyle({opacity: mid === id ? 1 : 0.15, fillOpacity: mid === id ? 1 : 0.08}));
  const mk = markers[id];
  if(mk) map.flyTo(mk.getLatLng(), 16, {duration: 0.8});
  if(window.innerWidth <= 768){ document.getElementById('sidebar').classList.add('open'); mobileSidebarOpen = true; }
}

// AUTH
function openAuth(){ document.getElementById('auth-overlay').classList.remove('hidden'); }
function closeAuth(){ document.getElementById('auth-overlay').classList.add('hidden'); document.getElementById('auth-err').textContent = ''; }
function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('auth-title').textContent = authMode === 'signin' ? 'Welcome back' : 'Create account';
  document.getElementById('auth-sub').textContent = authMode === 'signin' ? 'Sign in to pin your memories to the map.' : 'Join your friends on Pinned.';
  document.getElementById('auth-switch').innerHTML = authMode === 'signin' ? 'No account? <span>Sign up</span>' : 'Already have an account? <span>Sign in</span>';
}
async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-err');
  if(!email || !pass){ errEl.textContent = 'Please enter email and password.'; return; }
  if(authMode === 'signup'){
    const { error } = await sb.auth.signUp({email, password: pass});
    if(error){ errEl.textContent = error.message; return; }
    document.getElementById('auth-msg').textContent = 'Check your email to confirm!';
  } else {
    const { error } = await sb.auth.signInWithPassword({email, password: pass});
    if(error){ errEl.textContent = error.message; return; }
    closeAuth();
  }
}
async function signOut(){ await sb.auth.signOut(); }
function updateAuthUI(user){
  currentUser = user;
  document.getElementById('auth-btn').style.display = user ? 'none' : '';
  document.getElementById('add-btn').style.display = user ? '' : 'none';
  document.getElementById('signout-btn').style.display = user ? '' : 'none';
  document.getElementById('user-chip').style.display = user ? '' : 'none';
  if(user) document.getElementById('user-email-label').textContent = user.email;
}

// LOCATION SEARCH + CUSTOM COORDINATES
function searchLocation(){
  const query = document.getElementById('location-search-input').value.trim();
  if(!query){ document.getElementById('up-err').innerText = 'Enter a place name or address'; return; }
  // Use Nominatim (openstreetmap)
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&addressdetails=0`)
    .then(res => res.json())
    .then(data => {
      if(!data || data.length === 0) throw new Error('No results');
      const place = data[0];
      const lat = parseFloat(place.lat);
      const lng = parseFloat(place.lon);
      const display = place.display_name.split(',')[0] || query;
      setSelectedLocation(lat, lng, display);
    })
    .catch(err => { document.getElementById('up-err').innerText = 'Location not found'; });
}
function setSelectedLocation(lat, lng, displayName){
  pendingCustomLocation = { lat, lng, displayName };
  const previewDiv = document.getElementById('location-preview');
  const labelSpan = document.getElementById('selected-location-label');
  labelSpan.innerText = `📍 ${displayName} (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
  previewDiv.classList.remove('hidden');
  // Optionally fly map preview in small embedded? Not needed but neat
  if(map) map.flyTo([lat, lng], 14, {duration: 0.6});
  document.getElementById('up-err').innerText = '';
}
function clearSelectedLocation(){ pendingCustomLocation = null; document.getElementById('location-preview').classList.add('hidden'); }

// UPLOAD
function openUpload(){
  document.getElementById('upload-overlay').classList.remove('hidden');
  document.getElementById('up-err').textContent = '';
  selectedFile = null;
  pendingCustomLocation = null;
  document.getElementById('location-preview').classList.add('hidden');
  document.getElementById('location-search-input').value = '';
  const fd = document.getElementById('file-drop');
  fd.innerHTML = '<span class="file-drop-icon">🖼️</span>Tap to choose a photo';
  fd.classList.remove('has-file');
  document.getElementById('up-place').value = '';
  document.getElementById('up-caption').value = '';
  document.getElementById('up-tags').value = '';
}
function closeUpload(){ document.getElementById('upload-overlay').classList.add('hidden'); }
function handleFile(input){
  if(input.files && input.files[0]){ selectedFile = input.files[0]; const fd = document.getElementById('file-drop'); fd.innerHTML = `<span class="file-drop-icon">✅</span>${selectedFile.name}`; fd.classList.add('has-file'); }
}
async function submitMemory(){
  const campus = document.getElementById('up-campus').value;
  let place = document.getElementById('up-place').value.trim();
  const caption = document.getElementById('up-caption').value.trim();
  const tags = document.getElementById('up-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const errEl = document.getElementById('up-err');
  if(!place && pendingCustomLocation?.displayName) place = pendingCustomLocation.displayName;
  if(!place){ errEl.textContent = 'Please provide a place name or select a location.'; return; }
  if(!caption){ errEl.textContent = 'Please add a caption.'; return; }
  if(!currentUser){ errEl.textContent = 'You must be signed in.'; return; }
  
  let photo_url = null;
  if(selectedFile){
    const ext = selectedFile.name.split('.').pop();
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('photos').upload(path, selectedFile);
    if(upErr){ errEl.textContent = 'Photo upload failed: ' + upErr.message; return; }
    const { data: urlData } = sb.storage.from('photos').getPublicUrl(path);
    photo_url = urlData.publicUrl;
  }
  
  const memoryPayload = {
    user_id: currentUser.id, user_email: currentUser.email, campus, place, caption, photo_url,
    tagged_emails: tags, emoji: '📍', custom_lat: null, custom_lng: null
  };
  if(pendingCustomLocation){
    memoryPayload.custom_lat = pendingCustomLocation.lat;
    memoryPayload.custom_lng = pendingCustomLocation.lng;
  }
  const { error } = await sb.from('memories').insert(memoryPayload);
  if(error){ errEl.textContent = 'Failed: ' + error.message; return; }
  closeUpload();
  await loadMemories();
  setView(activeView);
}

function deleteMemory(id){ if(!confirm('Delete?')) return; const mem = memories.find(m => m.id === id); if(!mem || !currentUser || mem.user_id !== currentUser.id) return; sb.from('memories').delete().eq('id', id).then(()=>loadMemories()); }
function addComment(id){
  const input = document.getElementById('comment-input-'+id);
  const text = input.value.trim();
  if(!text || !currentUser) return;
  commentsByMemory[id] = commentsByMemory[id] || [];
  commentsByMemory[id].push({ id: Date.now().toString(), user_email: currentUser.email, text });
  input.value = '';
  renderSidebar();
}
function deleteComment(memoryId, commentId){ commentsByMemory[memoryId] = (commentsByMemory[memoryId] || []).filter(c => c.id !== commentId); renderSidebar(); }
function toggleMineOnly(){ showMineOnly = document.getElementById('mine-only-toggle').checked; renderSidebar(); setView(activeView); }
function getFilteredMemories(){
  let filtered = activeView === 'all' ? memories : memories.filter(m => m.campus === activeView);
  if(showMineOnly && currentUser) filtered = filtered.filter(m => m.user_id === currentUser.id);
  return filtered;
}
function openLightbox(url){ document.getElementById('lightbox').classList.remove('hidden'); document.getElementById('lightbox-img').src = url; }
function closeLightbox(e){ if(e.target.id === 'lightbox-img') return; document.getElementById('lightbox').classList.add('hidden'); }
function toggleMobileSidebar(){ mobileSidebarOpen = !mobileSidebarOpen; document.getElementById('sidebar').classList.toggle('open', mobileSidebarOpen); setTimeout(()=>map?.invalidateSize(), 320); }
function buildTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '<button class="tab active">All</button>';
  CAMPUSES.forEach(c => { const btn = document.createElement('button'); btn.className='tab'; btn.textContent=c.name; btn.onclick=()=>setView(c.name); wrap.appendChild(btn); });
  document.querySelector('.tab').onclick = () => setView('all');
}
function buildUploadCampusSelect(){
  const sel = document.getElementById('up-campus');
  sel.innerHTML = CAMPUSES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}

initMap(); buildTabs(); buildUploadCampusSelect(); loadMemories();
sb.auth.onAuthStateChange((event, session) => { updateAuthUI(session ? session.user : null); renderSidebar(); });
sb.auth.getSession().then(({ data }) => updateAuthUI(data.session ? data.session.user : null));
</script>
