
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.app { display: flex; flex-direction: column; height: 580px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }
.logo { font-size: 15px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 6px; }
.logo i { font-size: 18px; color: #378ADD; }
.campus-tabs { display: flex; gap: 6px; }
.tab { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--color-border-tertiary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-secondary); font-weight: 500; }
.tab:hover:not(.active) { background: var(--color-background-secondary); }
.add-btn { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 4px; }
.add-btn:hover { background: var(--color-background-secondary); }
.map-area { flex: 1; position: relative; overflow: hidden; background: #f0ece4; }
.map-svg { width: 100%; height: 100%; }
.sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 240px; background: var(--color-background-primary); border-left: 0.5px solid var(--color-border-tertiary); overflow-y: auto; display: flex; flex-direction: column; }
.sidebar-header { padding: 14px 14px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.sidebar-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.sidebar-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.memory-card { padding: 12px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); cursor: pointer; transition: background 0.1s; }
.memory-card:hover { background: var(--color-background-secondary); }
.memory-card.active { background: #E6F1FB; }
.mem-img { width: 100%; height: 80px; border-radius: var(--border-radius-md); object-fit: cover; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.mem-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.mem-place { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.mem-campus { font-size: 11px; padding: 2px 7px; border-radius: 999px; }
.mem-who { font-size: 12px; color: var(--color-text-secondary); }
.mem-date { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
.pin { cursor: pointer; }
.pin circle { transition: r 0.15s; }
.pin:hover circle.outer { r: 14; }
.tooltip { pointer-events: none; }
</style>

<div class="app">
  <div class="topbar">
    <div class="logo"><i class="ti ti-map-pin" aria-hidden="true"></i> Pinned</div>
    <div class="campus-tabs">
      <button class="tab active" onclick="setView('all')">All campuses</button>
      <button class="tab" onclick="setView('Georgetown')">Georgetown</button>
      <button class="tab" onclick="setView('UVA')">UVA</button>
      <button class="tab" onclick="setView('UNC')">UNC</button>
    </div>
    <button class="add-btn" onclick="sendPrompt('How would the upload flow work for adding a new memory pin to the map?')"><i class="ti ti-plus" aria-hidden="true"></i> Add memory</button>
  </div>

  <div class="map-area">
    <svg class="map-svg" viewBox="0 0 680 460" id="mapsvg">
      <!-- US outline simplified -->
      <rect width="680" height="460" fill="#f0ece4"/>
      <!-- Roads/grid lines for texture -->
      <line x1="0" y1="115" x2="440" y2="115" stroke="#e0dcd4" stroke-width="0.5"/>
      <line x1="0" y1="230" x2="440" y2="230" stroke="#e0dcd4" stroke-width="0.5"/>
      <line x1="0" y1="345" x2="440" y2="345" stroke="#e0dcd4" stroke-width="0.5"/>
      <line x1="110" y1="0" x2="110" y2="460" stroke="#e0dcd4" stroke-width="0.5"/>
      <line x1="220" y1="0" x2="220" y2="460" stroke="#e0dcd4" stroke-width="0.5"/>
      <line x1="330" y1="0" x2="330" y2="460" stroke="#e0dcd4" stroke-width="0.5"/>

      <!-- Campus cluster rings -->
      <!-- Georgetown cluster ~(185, 155) -->
      <circle cx="185" cy="155" r="38" fill="#378ADD" fill-opacity="0.07" stroke="#378ADD" stroke-opacity="0.2" stroke-width="0.5"/>
      <text x="185" y="205" text-anchor="middle" font-size="11" fill="#185FA5" font-family="var(--font-sans)" font-weight="500">Georgetown</text>

      <!-- UVA cluster ~(215, 235) -->
      <circle cx="215" cy="235" r="38" fill="#1D9E75" fill-opacity="0.07" stroke="#1D9E75" stroke-opacity="0.2" stroke-width="0.5"/>
      <text x="215" y="283" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="var(--font-sans)" font-weight="500">UVA</text>

      <!-- UNC cluster ~(175, 305) -->
      <circle cx="175" cy="305" r="38" fill="#D4537E" fill-opacity="0.07" stroke="#D4537E" stroke-opacity="0.2" stroke-width="0.5"/>
      <text x="175" y="353" text-anchor="middle" font-size="11" fill="#993556" font-family="var(--font-sans)" font-weight="500">UNC</text>

      <!-- Connector lines between campuses -->
      <line x1="185" y1="193" x2="207" y2="197" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>
      <line x1="215" y1="273" x2="190" y2="267" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>

      <!-- Georgetown pins -->
      <g class="pin" onclick="selectMemory(0)" id="pin0">
        <circle class="outer" cx="178" cy="140" r="11" fill="#378ADD" fill-opacity="0.15"/>
        <circle cx="178" cy="140" r="6" fill="#378ADD"/>
        <circle cx="178" cy="140" r="2.5" fill="white"/>
      </g>
      <g class="pin" onclick="selectMemory(1)" id="pin1">
        <circle class="outer" cx="198" cy="158" r="11" fill="#378ADD" fill-opacity="0.15"/>
        <circle cx="198" cy="158" r="6" fill="#378ADD"/>
        <circle cx="198" cy="158" r="2.5" fill="white"/>
      </g>
      <g class="pin" onclick="selectMemory(2)" id="pin2">
        <circle class="outer" cx="170" cy="165" r="11" fill="#378ADD" fill-opacity="0.15"/>
        <circle cx="170" cy="165" r="6" fill="#378ADD"/>
        <circle cx="170" cy="165" r="2.5" fill="white"/>
      </g>

      <!-- UVA pins -->
      <g class="pin" onclick="selectMemory(3)" id="pin3">
        <circle class="outer" cx="208" cy="220" r="11" fill="#1D9E75" fill-opacity="0.15"/>
        <circle cx="208" cy="220" r="6" fill="#1D9E75"/>
        <circle cx="208" cy="220" r="2.5" fill="white"/>
      </g>
      <g class="pin" onclick="selectMemory(4)" id="pin4">
        <circle class="outer" cx="230" cy="240" r="11" fill="#1D9E75" fill-opacity="0.15"/>
        <circle cx="230" cy="240" r="6" fill="#1D9E75"/>
        <circle cx="230" cy="240" r="2.5" fill="white"/>
      </g>

      <!-- UNC pins -->
      <g class="pin" onclick="selectMemory(5)" id="pin5">
        <circle class="outer" cx="168" cy="295" r="11" fill="#D4537E" fill-opacity="0.15"/>
        <circle cx="168" cy="295" r="6" fill="#D4537E"/>
        <circle cx="168" cy="295" r="2.5" fill="white"/>
      </g>
      <g class="pin" onclick="selectMemory(6)" id="pin6">
        <circle class="outer" cx="188" cy="315" r="11" fill="#D4537E" fill-opacity="0.15"/>
        <circle cx="188" cy="315" r="6" fill="#D4537E"/>
        <circle cx="188" cy="315" r="2.5" fill="white"/>
      </g>

      <!-- Legend -->
      <rect x="12" y="12" width="120" height="70" rx="6" fill="white" fill-opacity="0.9" stroke="#ddd" stroke-width="0.5"/>
      <circle cx="26" cy="30" r="5" fill="#378ADD"/>
      <text x="36" y="34" font-size="11" fill="#185FA5" font-family="var(--font-sans)">Georgetown</text>
      <circle cx="26" cy="48" r="5" fill="#1D9E75"/>
      <text x="36" y="52" font-size="11" fill="#0F6E56" font-family="var(--font-sans)">UVA</text>
      <circle cx="26" cy="66" r="5" fill="#D4537E"/>
      <text x="36" y="70" font-size="11" fill="#993556" font-family="var(--font-sans)">UNC</text>

      <!-- Zoom hint -->
      <text x="440" y="430" font-size="11" fill="#aaa" font-family="var(--font-sans)">click a pin to view memory</text>
    </svg>

    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title" id="sidebar-title">All memories</div>
        <div class="sidebar-sub" id="sidebar-sub">7 pins across 3 campuses</div>
      </div>
      <div id="memory-list"></div>
    </div>
  </div>
</div>

<script>
const memories = [
  { id: 0, campus: 'Georgetown', color: '#378ADD', bg: '#E6F1FB', textColor: '#185FA5', place: 'Healy Hall steps', who: 'Sarah + Jake', date: 'Sep 14', emoji: '🏛️', caption: 'First day of fall semester!' },
  { id: 1, campus: 'Georgetown', color: '#378ADD', bg: '#E6F1FB', textColor: '#185FA5', place: 'M Street coffee run', who: 'Sarah', date: 'Oct 3', emoji: '☕', caption: 'Studying for midterms, send help' },
  { id: 2, campus: 'Georgetown', color: '#378ADD', bg: '#E6F1FB', textColor: '#185FA5', place: 'Potomac waterfront', who: 'Sarah + Emma', date: 'Oct 18', emoji: '🌅', caption: 'Golden hour walk after class' },
  { id: 3, campus: 'UVA', color: '#1D9E75', bg: '#E1F5EE', textColor: '#0F6E56', place: 'The Lawn', who: 'Jake', date: 'Sep 22', emoji: '🌳', caption: 'Rotunda in the morning fog, so pretty' },
  { id: 4, campus: 'UVA', color: '#1D9E75', bg: '#E1F5EE', textColor: '#0F6E56', place: 'Corner diner', who: 'Jake + friends', date: 'Nov 1', emoji: '🍳', caption: 'Post-game brunch tradition' },
  { id: 5, campus: 'UNC', color: '#D4537E', bg: '#FBEAF0', textColor: '#993556', place: 'Franklin Street', who: 'Emma', date: 'Oct 7', emoji: '🎉', caption: 'Game day chaos, we won!!' },
  { id: 6, campus: 'UNC', color: '#D4537E', bg: '#FBEAF0', textColor: '#993556', place: 'Coker Arboretum', who: 'Emma', date: 'Nov 12', emoji: '🍂', caption: 'Peak fall foliage walk' },
];

let activeView = 'all';
let activeMemory = null;

function setView(campus) {
  activeView = campus;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['all','Georgetown','UVA','UNC'][i] === campus);
  });
  const filtered = campus === 'all' ? memories : memories.filter(m => m.campus === campus);
  const sub = campus === 'all' ? '7 pins across 3 campuses' : filtered.length + ' memories';
  document.getElementById('sidebar-title').textContent = campus === 'all' ? 'All memories' : campus;
  document.getElementById('sidebar-sub').textContent = sub;
  renderList(filtered);
  activeMemory = null;
  document.querySelectorAll('.pin circle.outer').forEach(c => c.style.display = '');
  memories.forEach(m => {
    const pin = document.getElementById('pin' + m.id);
    if (pin) pin.style.opacity = (campus === 'all' || m.campus === campus) ? '1' : '0.2';
  });
}

function renderList(list) {
  const el = document.getElementById('memory-list');
  el.innerHTML = list.map(m => `
    <div class="memory-card ${activeMemory === m.id ? 'active' : ''}" onclick="selectMemory(${m.id})" id="card${m.id}">
      <div class="mem-img" style="background:${m.bg}">${m.emoji}</div>
      <div class="mem-top">
        <span class="mem-place">${m.place}</span>
        <span class="mem-campus" style="background:${m.bg};color:${m.textColor}">${m.campus}</span>
      </div>
      <div class="mem-who">${m.who}</div>
      <div class="mem-date">${m.date} · ${m.caption}</div>
    </div>
  `).join('');
}

function selectMemory(id) {
  activeMemory = id;
  const m = memories[id];
  document.querySelectorAll('.memory-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  document.querySelectorAll('.pin').forEach((p, i) => p.style.opacity = memories[i].id === id ? '1' : '0.35');
  const pin = document.getElementById('pin' + id);
  if (pin) pin.style.opacity = '1';
}

setView('all');
</script>
