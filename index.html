<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pinned | Photo Memories</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #fff; color: #111; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 0.5px solid #e0e0e0; background: #fff; gap: 10px; flex-wrap: wrap; z-index: 1000; }
  .logo { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: #111; }
  .logo span { color: #378ADD; font-size: 20px; }
  .tabs-wrap { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .tab { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 0.5px solid #ddd; background: transparent; color: #666; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .tab.active { background: #f0f0f0; color: #111; border-color: #bbb; font-weight: 500; }
  .tab:hover:not(.active) { background: #f5f5f5; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .btn { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 0.5px solid #ccc; background: transparent; color: #111; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; transition: background 0.15s; }
  .btn:hover { background: #f5f5f5; }
  .btn.primary { background: #378ADD; color: #fff; border-color: #378ADD; }
  .btn.primary:hover { background: #185FA5; }
  .body { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; height: 100%; z-index: 1; }
  .sidebar { width: 240px; min-width: 240px; border-left: 0.5px solid #e0e0e0; overflow-y: auto; display: flex; flex-direction: column; background: #fff; }
  .sidebar-header { padding: 12px 14px 8px; border-bottom: 0.5px solid #e0e0e0; }
  .sidebar-title { font-size: 13px; font-weight: 500; color: #111; }
  .sidebar-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .mem-card { padding: 10px 14px; border-bottom: 0.5px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  .mem-card:hover { background: #f9f9f9; }
  .mem-card.active { background: #E6F1FB; }
  .mem-img { width: 100%; height: 80px; border-radius: 8px; object-fit: cover; margin-bottom: 7px; }
  .mem-emoji { width: 100%; height: 64px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 7px; }
  .mem-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; gap: 4px; }
  .mem-place { font-size: 13px; font-weight: 500; color: #111; }
  .mem-badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
  .mem-who { font-size: 12px; color: #666; }
  .mem-date { font-size: 11px; color: #aaa; margin-top: 2px; }
  .empty { padding: 24px 14px; font-size: 13px; color: #aaa; text-align: center; }

  /* Auth overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; display: flex; align-items: center; justify-content: center; }
  .overlay.hidden { display: none; }
  .modal { background: #fff; border-radius: 12px; padding: 28px; width: 340px; max-width: 90vw; }
  .modal h2 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: #666; margin-bottom: 20px; }
  .modal input { width: 100%; padding: 9px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; }
  .modal input:focus { border-color: #378ADD; }
  .modal .btn { width: 100%; justify-content: center; padding: 9px; font-size: 14px; border-radius: 8px; margin-bottom: 8px; }
  .modal .switch { font-size: 12px; color: #888; text-align: center; cursor: pointer; }
  .modal .switch span { color: #378ADD; text-decoration: underline; }
  .modal-err { font-size: 12px; color: #c0392b; margin-bottom: 8px; min-height: 16px; }
  .modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: #aaa; margin-top: -4px; }

  /* Upload modal */
  .upload-modal { background: #fff; border-radius: 12px; padding: 28px; width: 380px; max-width: 90vw; }
  .upload-modal h2 { font-size: 18px; font-weight: 500; margin-bottom: 18px; }
  .upload-modal label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
  .upload-modal input, .upload-modal select, .upload-modal textarea { width: 100%; padding: 9px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; font-family: inherit; }
  .upload-modal input:focus, .upload-modal select:focus, .upload-modal textarea:focus { border-color: #378ADD; }
  .upload-modal textarea { resize: vertical; min-height: 70px; }
  .file-drop { border: 1.5px dashed #ccc; border-radius: 8px; padding: 20px; text-align: center; font-size: 13px; color: #888; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
  .file-drop:hover { border-color: #378ADD; }
  .file-drop.has-file { border-color: #1D9E75; color: #1D9E75; }
  .upload-actions { display: flex; gap: 8px; }
  .upload-actions .btn { flex: 1; justify-content: center; padding: 9px; font-size: 14px; border-radius: 8px; }
  .user-chip { font-size: 12px; color: #666; display: flex; align-items: center; gap: 5px; }
  .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; }

  .topbar-toggle { font-size: 12px; color: #555; display:flex; align-items:center; gap:6px; }
  .lightbox { position: fixed; inset:0; background: rgba(0,0,0,0.92); z-index:5000; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lightbox.hidden { display:none; }
  .lightbox img { max-width:90vw; max-height:90vh; border-radius:12px; }
  .lightbox-close { position:absolute; top:20px; right:28px; font-size:36px; color:white; cursor:pointer; }
  .mem-actions { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .mini-btn { border:none; background:#f1f1f1; padding:5px 10px; border-radius:999px; font-size:11px; cursor:pointer; }
  .mini-btn:hover { background:#e6e6e6; }
  .comments { margin-top:10px; border-top:0.5px solid #eee; padding-top:8px; }
  .comment { font-size:11px; color:#444; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
  .comment-input { width:100%; margin-top:6px; border:0.5px solid #ccc; border-radius:8px; padding:6px 8px; font-size:11px; }
  .tag-list { margin-top:5px; font-size:11px; color:#666; }

</style>
</head>
<body>

<!-- Auth overlay -->
<div class="overlay" id="auth-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeAuth()">×</button>
    <h2 id="auth-title">Sign in</h2>
    <p id="auth-sub">Sign in to add memories to the map.</p>
    <div class="modal-err" id="auth-err"></div>
    <input type="email" id="auth-email" placeholder="Email"/>
    <input type="password" id="auth-pass" placeholder="Password"/>
    <button class="btn primary" onclick="submitAuth()">Continue</button>
    <div class="modal-err" id="auth-msg" style="color:#1D9E75"></div>
    <div class="switch" id="auth-switch" onclick="toggleAuthMode()">No account? <span>Sign up</span></div>
  </div>
</div>

<!-- Upload overlay -->
<div class="overlay hidden" id="upload-overlay">
  <div class="upload-modal">
    <button class="modal-close" onclick="closeUpload()">×</button>
    <h2>Add a memory</h2>
    <label>Campus</label>
    <select id="up-campus"></select>
    <label>Place / spot</label>
    <input type="text" id="up-place" placeholder="e.g. The Lawn, front steps..."/>
    <label>Caption</label>
    <textarea id="up-caption" placeholder="What's the vibe?"></textarea>
    
    <label>Tag friends (comma-separated emails)</label>
    <input type="text" id="up-tags" placeholder="friend@example.com, another@example.com"/>

    <label>Photo (optional)</label>
    <div class="file-drop" id="file-drop" onclick="document.getElementById('up-file').click()">
      Tap to choose a photo
    </div>
    <input type="file" id="up-file" accept="image/*" style="display:none" onchange="handleFile(this)"/>
    <div class="modal-err" id="up-err"></div>
    <div class="upload-actions">
      <button class="btn" onclick="closeUpload()">Cancel</button>
      <button class="btn primary" onclick="submitMemory()">Post memory</button>
    </div>
  </div>
</div>

<div class="topbar">
  <div class="logo"><span>📍</span> Pinned</div>
  <div class="tabs-wrap" id="tabs"></div>
  <div class="topbar-right">
    <div class="user-chip" id="user-chip" style="display:none"><div class="user-dot"></div><span id="user-email-label"></span></div>
    <button class="btn" id="auth-btn" onclick="openAuth()">Sign in</button>
    <button class="btn primary" id="add-btn" style="display:none" onclick="openUpload()">+ Add memory</button>
    
<label class="topbar-toggle">
  <input type="checkbox" id="mine-only-toggle" onchange="toggleMineOnly()"/>
  My memories
</label>

    <button class="btn" id="signout-btn" style="display:none" onclick="signOut()">Sign out</button>
  </div>
</div>

<div class="body">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title" id="s-title">All memories</div>
      <div class="sidebar-sub" id="s-sub">Loading...</div>
    </div>
    <div id="mem-list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dsxwytqvoshceqwljibr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeHd5dHF2b3NoY2Vxd2xqaWJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTk3MTEsImV4cCI6MjA5NTE3NTcxMX0.ik0qV5ygBS4HT-IW06V9rMrxaC6GGb_kS9uos5XBfT0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CAMPUSES = [
  {name:'Haverford',      lat:39.9879, lng:-75.3054, color:'#534AB7', bg:'#EEEDFE', tc:'#3C3489'},
  {name:'William & Mary', lat:37.2707, lng:-76.7075, color:'#1D9E75', bg:'#E1F5EE', tc:'#0F6E56'},
  {name:'Duke',           lat:36.0014, lng:-78.9382, color:'#185FA5', bg:'#E6F1FB', tc:'#0C447C'},
  {name:'Maryland',       lat:38.9869, lng:-76.9426, color:'#A32D2D', bg:'#FCEBEB', tc:'#791F1F'},
  {name:'American',       lat:38.9376, lng:-77.0872, color:'#854F0B', bg:'#FAEEDA', tc:'#633806'},
  {name:'Vermont',        lat:44.4759, lng:-73.1965, color:'#3B6D11', bg:'#EAF3DE', tc:'#27500A'},
  {name:'Mt Holyoke',     lat:42.2548, lng:-72.5739, color:'#993556', bg:'#FBEAF0', tc:'#72243E'},
  {name:'Florida Tech',   lat:28.0617, lng:-80.6243, color:'#993C1D', bg:'#FAECE7', tc:'#712B13'},
  {name:'Cal Poly SLO',   lat:35.2999, lng:-120.6625,color:'#0F6E56', bg:'#E1F5EE', tc:'#085041'},
  {name:'Richmond',       lat:37.5745, lng:-77.5408, color:'#7F77DD', bg:'#EEEDFE', tc:'#534AB7'},
  {name:'Ohio State',     lat:40.0076, lng:-83.0300, color:'#888780', bg:'#F1EFE8', tc:'#5F5E5A'},
];

let map, markers = {}, memories = [], activeView = 'all', activeId = null;
let currentUser = null, authMode = 'signin', selectedFile = null;

function campusFor(name){ return CAMPUSES.find(c => c.name === name); }

function initMap(){
  map = L.map('map', {zoomControl: true}).setView([39.5, -90], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
}

function buildTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tab active'; all.textContent = 'All';
  all.onclick = () => setView('all');
  wrap.appendChild(all);
  CAMPUSES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab'; btn.textContent = c.name;
    btn.onclick = () => setView(c.name);
    wrap.appendChild(btn);
  });
}

function buildUploadCampusSelect(){
  const sel = document.getElementById('up-campus');
  sel.innerHTML = CAMPUSES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}

async function loadMemories(){
  const { data, error } = await sb.from('memories').select('*').order('created_at', {ascending: false});
  if(error){ console.error(error); return; }
  memories = data || [];
  clearMarkers();
  memories.forEach(addMarker);
  renderSidebar();
}

function clearMarkers(){
  Object.values(markers).forEach(m => m.remove());
  markers = {};
}

function addMarker(m){
  const c = campusFor(m.campus);
  if(!c) return;
  const jlat = c.lat + (Math.random() - 0.5) * 0.008;
  const jlng = c.lng + (Math.random() - 0.5) * 0.008;
  const marker = L.circleMarker([jlat, jlng], {
    radius: 8, fillColor: c.color, color: 'white', weight: 2, fillOpacity: 1
  }).addTo(map);
  marker.on('click', () => selectMemory(m.id));
  marker.bindTooltip(m.place + ' · ' + m.campus, {direction: 'top', offset: [0, -8]});
  markers[m.id] = marker;
}

function setView(campus){
  activeView = campus; activeId = null;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', (campus === 'all' && t.textContent === 'All') || t.textContent === campus);
  });
  const filtered = getFilteredMemories();
  document.getElementById('s-title').textContent = campus === 'all' ? 'All memories' : campus;
  document.getElementById('s-sub').textContent = filtered.length + ' memor' + (filtered.length === 1 ? 'y' : 'ies') +
    (campus === 'all' ? ' across ' + CAMPUSES.length + ' campuses' : '');
  Object.entries(markers).forEach(([id, mk]) => {
    const mem = memories.find(m => m.id === id);
    const show = campus === 'all' || (mem && mem.campus === campus);
    mk.setStyle({opacity: show ? 1 : 0.15, fillOpacity: show ? 1 : 0.1});
  });
  if(campus !== 'all'){
    const c = campusFor(campus);
    if(c) map.flyTo([c.lat, c.lng], 14, {duration: 1});
  } else {
    map.flyTo([39.5, -90], 4, {duration: 1});
  }
  renderList(filtered);
}

function renderSidebar(){
  const filtered = getFilteredMemories();
  document.getElementById('s-sub').textContent = filtered.length + ' memor' + (filtered.length === 1 ? 'y' : 'ies') +
    (activeView === 'all' ? ' across ' + CAMPUSES.length + ' campuses' : '');
  renderList(filtered);
}

function renderList(list){
  const el = document.getElementById('mem-list');
  if(list.length === 0){ el.innerHTML = '<div class="empty">No memories here yet.<br/>Be the first to add one!</div>'; return; }
  el.innerHTML = list.map(m => {
    const c = campusFor(m.campus) || {bg:'#eee', tc:'#333'};
    const imgHtml = m.photo_url
      ? `<img class="mem-img" src="${m.photo_url}" alt="${m.place}" loading="lazy" onclick="event.stopPropagation();openLightbox('${m.photo_url}')"/>`
      : `<div class="mem-emoji" style="background:${c.bg}">${m.emoji || '📍'}</div>`;
    const date = new Date(m.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return `<div class="mem-card${activeId === m.id ? ' active' : ''}" id="card${m.id}" onclick="selectMemory('${m.id}')">
      ${imgHtml}
      <div class="mem-row">
        <span class="mem-place">${m.place}</span>
        <span class="mem-badge" style="background:${c.bg};color:${c.tc}">${m.campus}</span>
      </div>
      <div class="mem-who">${m.user_email || 'Anonymous'}</div>
      <div class="mem-date">${date} · ${m.caption}</div>
      ${m.tags ? `<div class="tag-list">Tagged: ${m.tags.join(', ')}</div>` : ''}
      <div class="mem-actions">
        ${currentUser && currentUser.id === m.user_id ? `<button class="mini-btn" onclick="event.stopPropagation();deleteMemory('${m.id}')">Delete</button>` : ''}
      </div>

      <div class="comments">
        ${(commentsByMemory[m.id] || []).map(c => `
          <div class="comment">
            <span><strong>${c.user_email}</strong>: ${c.text}</span>
            ${currentUser && c.user_email === currentUser.email
              ? `<button class="mini-btn" onclick="event.stopPropagation();deleteComment('${m.id}','${c.id}')">×</button>`
              : ''}
          </div>
        `).join('')}

        ${currentUser ? `
          <input class="comment-input" id="comment-input-${m.id}" placeholder="Add a comment..." onclick="event.stopPropagation()"/>
          <button class="mini-btn" style="margin-top:6px" onclick="event.stopPropagation();addComment('${m.id}')">Post</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

function selectMemory(id){
  activeId = id;
  document.querySelectorAll('.mem-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card' + id);
  if(card){ card.classList.add('active'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  Object.entries(markers).forEach(([mid, mk]) => {
    mk.setStyle({opacity: mid === id ? 1 : 0.2, fillOpacity: mid === id ? 1 : 0.15});
  });
  const mk = markers[id];
  if(mk) map.flyTo(mk.getLatLng(), 16, {duration: 0.8});
}

// Auth
function openAuth(){ document.getElementById('auth-overlay').classList.remove('hidden'); }
function closeAuth(){ document.getElementById('auth-overlay').classList.add('hidden'); document.getElementById('auth-err').textContent = ''; }
function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('auth-title').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('auth-sub').textContent = authMode === 'signin' ? 'Sign in to add memories to the map.' : 'Join your friends on Pinned.';
  document.getElementById('auth-switch').innerHTML = authMode === 'signin' ? 'No account? <span>Sign up</span>' : 'Already have an account? <span>Sign in</span>';
  document.getElementById('auth-err').textContent = '';
  document.getElementById('auth-msg').textContent = '';
}

async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-err');
  const msgEl = document.getElementById('auth-msg');
  errEl.textContent = ''; msgEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Please enter your email and password.'; return; }
  if(authMode === 'signup'){
    const { error } = await sb.auth.signUp({email, password: pass});
    if(error){ errEl.textContent = error.message; return; }
    msgEl.textContent = 'Check your email to confirm your account!';
  } else {
    const { error } = await sb.auth.signInWithPassword({email, password: pass});
    if(error){ errEl.textContent = error.message; return; }
    closeAuth();
  }
}

async function signOut(){
  await sb.auth.signOut();
}

function updateAuthUI(user){
  currentUser = user;
  document.getElementById('auth-btn').style.display = user ? 'none' : '';
  document.getElementById('add-btn').style.display = user ? '' : 'none';
  document.getElementById('signout-btn').style.display = user ? '' : 'none';
  document.getElementById('user-chip').style.display = user ? '' : 'none';
  if(user) document.getElementById('user-email-label').textContent = user.email;
}

// Upload
function openUpload(){
  document.getElementById('upload-overlay').classList.remove('hidden');
  document.getElementById('up-err').textContent = '';
  selectedFile = null;
  document.getElementById('file-drop').textContent = 'Tap to choose a photo';
  document.getElementById('file-drop').classList.remove('has-file');
}
function closeUpload(){ document.getElementById('upload-overlay').classList.add('hidden'); }

function handleFile(input){
  if(input.files && input.files[0]){
    selectedFile = input.files[0];
    document.getElementById('file-drop').textContent = selectedFile.name;
    document.getElementById('file-drop').classList.add('has-file');
  }
}

async function submitMemory(){
  const campus = document.getElementById('up-campus').value;
  const place = document.getElementById('up-place').value.trim();
  const caption = document.getElementById('up-caption').value.trim();
  const tags = document.getElementById('up-tags').value
    .split(',')
    .map(t => t.trim())
    .filter(Boolean);
  const errEl = document.getElementById('up-err');
  errEl.textContent = '';
  if(!place || !caption){ errEl.textContent = 'Please fill in place and caption.'; return; }
  if(!currentUser){ errEl.textContent = 'You must be signed in.'; return; }

  let photo_url = null;
  if(selectedFile){
    const ext = selectedFile.name.split('.').pop();
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('photos').upload(path, selectedFile);
    if(upErr){ errEl.textContent = 'Photo upload failed: ' + upErr.message; return; }
    const { data: urlData } = sb.storage.from('photos').getPublicUrl(path);
    photo_url = urlData.publicUrl;
  }

  const { error } = await sb.from('memories').insert({
    user_id: currentUser.id,
    user_email: currentUser.email,
    campus, place, caption, photo_url,
    tags,
    emoji: '📍'
  });

  if(error){ errEl.textContent = 'Failed to save: ' + error.message; return; }
  closeUpload();
  document.getElementById('up-place').value = '';
  document.getElementById('up-caption').value = '';
  await loadMemories();
}


let showMineOnly = false;
let commentsByMemory = {};

function toggleMineOnly(){
  showMineOnly = document.getElementById('mine-only-toggle').checked;
  renderSidebar();
  setView(activeView);
}

function getFilteredMemories(){
  let filtered = activeView === 'all'
    ? memories
    : memories.filter(m => m.campus === activeView);

  if(showMineOnly && currentUser){
    filtered = filtered.filter(m => m.user_id === currentUser.id);
  }

  return filtered;
}

function openLightbox(url){
  document.getElementById('lightbox').classList.remove('hidden');
  document.getElementById('lightbox-img').src = url;
}

function closeLightbox(e){
  if(e.target.id === 'lightbox-img') return;
  document.getElementById('lightbox').classList.add('hidden');
}

async function deleteMemory(id){
  if(!confirm('Delete this memory?')) return;

  const mem = memories.find(m => m.id === id);
  if(!mem || !currentUser || mem.user_id !== currentUser.id) return;

  await sb.from('memories').delete().eq('id', id);
  await loadMemories();
}

async function addComment(id){
  const input = document.getElementById('comment-input-' + id);
  const text = input.value.trim();

  if(!text || !currentUser) return;

  commentsByMemory[id] = commentsByMemory[id] || [];
  commentsByMemory[id].push({
    id: Date.now().toString(),
    user_email: currentUser.email,
    text
  });

  input.value = '';
  renderSidebar();
}

function deleteComment(memoryId, commentId){
  commentsByMemory[memoryId] =
    (commentsByMemory[memoryId] || []).filter(c => c.id !== commentId);

  renderSidebar();
}


// Init
sb.auth.onAuthStateChange((event, session) => {
  updateAuthUI(session ? session.user : null);
});

sb.auth.getSession().then(({ data }) => {
  updateAuthUI(data.session ? data.session.user : null);
});

initMap();
buildTabs();
buildUploadCampusSelect();
loadMemories();
</script>
